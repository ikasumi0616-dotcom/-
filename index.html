<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Music App</title>
    <style>
        :root { --bg: #000; --text: #fff; --card: #1c1c1e; --radius: 12px; --bar-color: #ffb7c5; }
        html, body { margin: 0; padding: 0; height: 100%; width: 100%; overflow: hidden; position: fixed; background: var(--bg); color: var(--text); font-family: -apple-system, sans-serif; -webkit-tap-highlight-color: transparent; touch-action: manipulation; }
        #library-screen { padding: 20px; padding-top: 80px; height: 100vh; overflow-y: auto; box-sizing: border-box; padding-bottom: 200px; }
        .song-item { display: flex; align-items: center; padding: 12px 0; border-bottom: 0.5px solid rgba(128,128,128,0.2); cursor: pointer; }
        .song-item img { width: 55px; height: 55px; border-radius: var(--radius); margin-right: 15px; object-fit: cover; }
        #mini-player { position: fixed; bottom: 15px; left: 10px; right: 10px; height: 64px; background: var(--card); border-radius: 12px; display: flex; align-items: center; padding: 0 15px; z-index: 200; transform: translateY(120px); transition: 0.5s cubic-bezier(0.23, 1, 0.32, 1); box-shadow: 0 5px 15px rgba(0,0,0,0.3); }
        #mini-player.visible { transform: translateY(0); }
        #mini-progress { position: absolute; top: 0; left: 0; height: 2px; background: var(--bar-color); width: 0%; }
        #mini-player img { width: 44px; height: 44px; border-radius: 4px; margin-right: 12px; flex-shrink: 0; }
        .btn-container { position: relative; width: 44px; height: 44px; flex-shrink: 0; }
        .btn-container span { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); font-size: 28px; display: none; }
        .is-playing .icon-pause { display: block; }
        .is-paused .icon-play { display: block; }
        #player-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.8); display: none; z-index: 300; }
        #player-overlay.active { display: block; }
        #player-screen { position: fixed; bottom: 0; left: 0; width: 100%; height: 94%; background: var(--card); display: flex; flex-direction: column; align-items: center; border-radius: 30px 30px 0 0; transform: translateY(100%); transition: 0.4s cubic-bezier(0.25, 1, 0.5, 1); z-index: 400; touch-action: none; overflow: hidden; }
        #bg-blur { position: absolute; inset: 0; z-index: -1; opacity: 0; transition: 0.8s; background: linear-gradient(180deg, #4b3a5a 0%, #2a1a3a 100%); }
        #player-screen.lyrics-active #bg-blur { opacity: 1; }
        .handle { width: 40px; height: 5px; background: rgba(128,128,128,0.4); border-radius: 5px; margin: 15px 0 20px; z-index: 501; }
        .jacket-container { position: relative; width: 54%; aspect-ratio: 1/1; display: flex; justify-content: center; align-items: center; margin-top: 50px; margin-bottom: 50px; transition: 0.5s cubic-bezier(0.25, 1, 0.5, 1); z-index: 10; }
        #player-screen.lyrics-active .jacket-container { width: 45px; height: 45px; margin-top: 0px; margin-bottom: 0px; position: absolute; top: 40px; left: 30px; }
        .p-jacket { width: 100%; height: 100%; border-radius: 15px; z-index: 10; object-fit: cover; transition: 0.3s; -webkit-user-drag: none; user-select: none; }
        .p-jacket.paused { transform: scale(0.9); filter: brightness(0.7); }
        #lyrics-view { position: absolute; top: 110px; left: 0; width: 100%; height: 55%; padding: 0 40px; box-sizing: border-box; overflow-y: auto; opacity: 0; pointer-events: none; transition: 0.4s; z-index: 100; display: flex; flex-direction: column; scroll-behavior: smooth; }
        #player-screen.lyrics-active #lyrics-view { opacity: 1; pointer-events: auto; }
        .lyric-line { font-size: 26px; font-weight: 700; margin-bottom: 30px; color: rgba(255,255,255,0.2); transition: 0.4s; text-align: left; line-height: 1.4; }
        .lyric-line.active { color: #fff; transform: scale(1.05); transform-origin: left center; }
        #visualizer { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 250%; height: 250%; z-index: 1; pointer-events: none; transition: opacity 0.3s; }
        /* 歌詞モードの時はアナライザーを消す */
        #player-screen.lyrics-active #visualizer { opacity: 0; }
        #lyrics-toggle { position: absolute; left: 30px; bottom: 40px; width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; background: none; border: none; z-index: 600; opacity: 0.4; transition: 0.3s; cursor: pointer; outline: none; }
        #lyrics-toggle.active { opacity: 1; }
        #lyrics-toggle svg { fill: #fff; width: 24px; height: 24px; }
        .seek-area { width: 85%; margin-top: 15px; position: relative; z-index: 500; transition: 0.4s; }
        .seek-container { width: 100%; height: 4px; background: rgba(128,128,128,0.2); border-radius: 2px; position: relative; }
        .seek-bar-fill { position: absolute; top: 0; left: 0; height: 100%; background: var(--bar-color); border-radius: 2px; width: 0%; pointer-events: none; }
        #p-seek-range { -webkit-appearance: none; width: 100%; background: transparent; position: absolute; top: -15px; height: 34px; outline: none; margin: 0; z-index: 600; cursor: pointer; }
        .time-box { display: flex; justify-content: space-between; width: 100%; font-size: 12px; margin-top: 10px; opacity: 0.6; }
        .play-btn-main { position: relative; background: none; border: none; color: var(--text); width: 100px; height: 100px; display: flex; align-items: center; justify-content: center; margin-top: 20px; outline: none; z-index: 500; }
        .play-btn-main span { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); font-size: 80px; display: none; }
        #song-info-main { transition: 0.4s; width:85%; margin-top:10px; text-align: center; }
        #player-screen.lyrics-active #song-info-main { transform: translateX(65px); text-align: left; width: 70%; margin-top: -15px; }
    </style>
</head>
<body oncontextmenu="return false;">

<div id="library-screen">
    <h1 style="font-weight:700;">ライブラリ</h1>
    <div id="song-list"></div>
</div>

<div id="mini-player" onclick="showFullPlayer()">
    <div id="mini-progress"></div>
    <img src="" id="m-jacket" oncontextmenu="return false;">
    <div style="flex:1; overflow:hidden;">
        <div id="m-title" style="font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;"></div>
        <div id="m-artist" style="font-size:12px; opacity:0.6;"></div>
    </div>
    <div class="btn-container is-paused" id="m-play-wrapper" onclick="event.stopPropagation(); toggleAudio();">
        <span class="icon-play">▶</span><span class="icon-pause">II</span>
    </div>
</div>

<div id="player-overlay" onclick="closePlayer()">
    <div id="player-screen" onclick="event.stopPropagation()">
        <div id="bg-blur"></div>
        <button onclick="closePlayer()" style="position:absolute;right:20px;top:20px;font-size:24px;color:#fff;background:none;border:none;opacity:0.6;z-index:600;">✕</button>
        <div class="handle"></div>
        <div class="jacket-container">
            <canvas id="visualizer"></canvas>
            <img src="" id="p-jacket" class="p-jacket paused" oncontextmenu="return false;" onmousedown="startPress()" onmouseup="endPress()" ontouchstart="startPress()" ontouchend="endPress()">
        </div>
        <div id="song-info-main">
            <div id="p-title" style="font-size:20px; font-weight:700;"></div>
            <div id="p-artist" style="font-size:16px; opacity:0.7;"></div>
        </div>
        <div id="lyrics-view"></div>
        <div class="seek-area">
            <div class="seek-container">
                <div id="p-fill" class="seek-bar-fill"></div>
                <input type="range" id="p-seek-range" value="0" step="0.1">
            </div>
            <div class="time-box">
                <span id="time-current">0:00</span><span id="time-total">0:00</span>
            </div>
        </div>
        <div class="play-btn-main is-paused" id="p-play-wrapper" onclick="toggleAudio()">
            <span class="icon-play">▶</span><span class="icon-pause">II</span>
        </div>
        <button id="lyrics-toggle" onclick="toggleLyricsMode()">
            <svg viewBox="0 0 24 24"><path d="M21 15h2v2h-2v-2zm0-4h2v2h-2v-2zm2 8h-2v2h2v-2zM13 15h2v2h-2v-2zm0-4h2v2h-2v-2zm2 8h-2v2h2v-2zm-7-4h2v2H8v-2zm0-4h2v2H8v-2zm2 8H8v2h2v-2zm-7-4h2v2H3v-2zm0-4h2v2H3v-2zm2 8H3v2h2v-2zm-2-8h2v2H3v-2zm0-4h2v2H3V7zm2-4H3v2h2V3zm5 0H8v2h2V3zm5 0h-2v2h2V3zm5 0h-2v2h2V3zM5 15H3v2h2v-2z"/></svg>
        </button>
    </div>
</div>

<script>
    const BASE_URL = `https://raw.githubusercontent.com/ikasumi0616-dotcom/-/main/`;
    const songs = [
        { title:'合言葉Ⅲ', artist:'DECO*27', img:'https://m.media-amazon.com/images/I/71yCSNyUdSL._UF1000,1000_QL80_.jpg', src:'12.m4a',
            syncLyrics: [
                {time: 0, text: "想いの冒険を 忘れずに"}, {time: 2.8, text: "全部言えるかな"}, {time: 6.0, text: "君から聞きたいよ 何回"}, {time: 9.3, text: "目の僕に出会った？"}, {time: 12.5, text: "僕は変わりました 新しい"}, {time: 15.8, text: "君に出会うために"}, {time: 19.1, text: "「さよなら」は言わないよ"}, {time: 22.4, text: "また会えるから"}, {time: 26.0, text: "（間奏）"}, {time: 39.0, text: "ハロー また会えたね"}, {time: 42.3, text: "昨日よりはちょっと"}, {time: 45.6, text: "素直になれるかな"}, {time: 48.9, text: "ドキドキを数えて"}, {time: 52.2, text: "パレットに広げた"}, {time: 55.5, text: "君色のメロディ"}, {time: 58.8, text: "不器用なステップで"}, {time: 62.1, text: "ここまで来たんだ"}, {time: 65.0, text: "大好きの詰め合わせ"}, {time: 68.3, text: "受け取ってくれますか？"}, {time: 71.6, text: "君が笑うだけで"}, {time: 74.9, text: "魔法にかかるんだ"}, {time: 78.2, text: "「ありがとう」じゃ足りない"}, {time: 81.5, text: "特別な合言葉"}, {time: 84.8, text: "3 2 1 ほら！"}, {time: 88.1, text: "想いの冒険を 忘れずに"}, {time: 91.4, text: "全部言えるかな"}, {time: 94.7, text: "君から聞きたいよ 何回"}, {time: 98.0, text: "目の僕に出会った？"}, {time: 101.3, text: "僕は変わりました 新しい"}, {time: 104.6, text: "君に出会うために"}, {time: 107.9, text: "「さよなら」は言わないよ"}, {time: 111.2, text: "また会えるから"}, {time: 114.5, text: "（間奏）"}, {time: 127.5, text: "もっと 知りたいんだ"}, {time: 130.8, text: "君の好きなことも"}, {time: 134.1, text: "ちょっと 苦手なのも"}, {time: 137.4, text: "全部を抱きしめて"}, {time: 140.7, text: "歩いていきたいよ"}, {time: 144.0, text: "未来への地図広げ"}, {time: 147.3, text: "泣き虫な僕だって"}, {time: 150.6, text: "君がいれば強くなれる"}, {time: 153.9, text: "最高の詰め合わせ"}, {time: 157.2, text: "分け合ってくれますか？"}, {time: 160.5, text: "君と僕の間に"}, {time: 163.8, text: "虹を架けるから"}, {time: 167.1, text: "「大好き」を伝えよう"}, {time: 170.4, text: "何千回も響け"}, {time: 173.7, text: "3 2 1 ほら！"}, {time: 177.0, text: "想いの冒険を 忘れずに"}, {time: 180.3, text: "全部言えるかな"}, {time: 183.6, text: "君から聞きたいよ 何回"}, {time: 186.9, text: "目の僕に出会った？"}, {time: 190.2, text: "僕は変わりました 新しい"}, {time: 193.5, text: "君に出会うために"}, {time: 196.8, text: "「さよなら」は言わないよ"}, {time: 200.1, text: "また会えるから"}, {time: 203.4, text: "（ギターソロ）"}, {time: 229.7, text: "想いの冒険を 忘れずに"}, {time: 233.0, text: "全部言えるかな"}, {time: 236.3, text: "君から聞きたいよ 何回"}, {time: 239.6, text: "目の僕に出会った？"}, {time: 242.9, text: "僕は変わりました 新しい"}, {time: 246.2, text: "君に出会うために"}, {time: 249.5, text: "「さよなら」は言わないよ"}, {time: 252.8, text: "また会えるから"}, {time: 256.1, text: "「大好き」だよ"}
            ]
        },
        {title:'罪と罰', artist:'DECO*27', img:'https://img.atwiki.jp/hmiku/attach/6469/504/IMG_Crime-and-Punishment-Reloaded.JPG', src:'9.m4a'},
        {title:'ビノミ', artist:'MARETU', img:'https://pimg.awa.io/v2/jacket/43bc05d3089cd67cd040.w800.h800.v1769421348.webp', src:'11.m4a'},
        {title:'水色侵略', artist:'ナユタン星人', img:'https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQFSIg4JHtAksIoZjpoCoiHVxorSrSfVItpfxMThqFO7ptiPkgRYI-qq1Y&s=10', src:'song1.m4a'},
        {title:'キセキ', artist:'GReeeeN', img:'https://img.hmv.co.jp/hybridimage/news/images/21/0810/1019/body_150020.jpeg', src:'10.m4a'},
        {title:'ただ君に晴れ', artist:'ヨルシカ', img:'https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQoirt4O4EZaKDVV-OZBHIxqnCemfKkk4IwIDJ28sS7iiDQmdZRU-Yg4B8h&s=10', src:'song2.m4a'},
        {title:'正しくなれない', artist:'ずっと真夜中でいいのに。', img:'https://i.kfs.io/album/global/96695506,1v1/fit/500x500.jpg', src:'song3.m4a'},
        {title:'フォニイ', artist:'ツミキ', img:'https://i1.sndcdn.com/artworks-tT9a73bRyGkxGhyM-gD3vjA-t500x500.jpg', src:'song4.m4a'},
        {title:'エゴロック', artist:'すりぃ', img:'https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRnUm5J7ccLutsqE-OElu_8yzJZXClKv98UWXiNVBHv7AtydVwZtMBLAdY&s=10', src:'song5.m4a'},
        {title:'恋風', artist:'幾田りら', img:'https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSR1CTX1feIVp0pqB5dsukeZg9TLh9SfxPZKrT779M9MlIjL4swLFbMt2o&s=10', src:'song6.m4a'},
        {title:'怪獣の花唄', artist:'Vaundy', img:'https://i.ytimg.com/vi/QPmwuAe2wBA/maxresdefault.jpg', src:'song7.m4a'},
        {title:'プロポーズ', artist:'なとり', img:'https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTSqJHqCO-a88-rl7YZiHVhkHSiKNipFC3Y69S6AjMi7pimx1e1-RpbTlkW&s=10', src:'song8.m4a'}
    ];

    const audio = new Audio();
    audio.crossOrigin = "anonymous";
    let audioCtx, analyser, source, currentIdx = 0, vizMode = 0, isSeeking = false, particles = [], pressTimer;
    const canvas = document.getElementById('visualizer'), ctx = canvas.getContext('2d');

    window.addEventListener('DOMContentLoaded', () => {
        document.getElementById('song-list').innerHTML = songs.map((s, i) => `
            <div class="song-item" onclick="playSong(${i})">
                <img src="${s.img}" oncontextmenu="return false;"><div><div style="font-weight:600;">${s.title}</div><div style="font-size:12px;opacity:0.6;">${s.artist}</div></div>
            </div>`).join('');
        initParticles();
    });

    function initParticles() { particles = []; for(let i=0; i<150; i++) particles.push({ a: Math.random()*Math.PI*2, life: Math.random(), speed: Math.random() * 0.005 + 0.002 }); }
    function initCtx() { if (!audioCtx) { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); analyser = audioCtx.createAnalyser(); analyser.fftSize = 512; source = audioCtx.createMediaElementSource(audio); source.connect(analyser); analyser.connect(audioCtx.destination); draw(); } }
    function draw() { requestAnimationFrame(draw); const w = canvas.offsetWidth, h = canvas.offsetHeight; if(!w) return; canvas.width = w * 2; canvas.height = h * 2; ctx.scale(2, 2); ctx.clearRect(0,0,w,h); if(!analyser) return; const data = new Uint8Array(analyser.frequencyBinCount); analyser.getByteFrequencyData(data); const innerRadius = (Math.min(w,h)/2) * 0.45; if (vizMode === 0) { ctx.fillStyle = "#ffb7c5"; for(let i=0; i<80; i++){ const val = data[i%80]; const finalH = Math.pow(val/255, 3.0) * 80; ctx.save(); ctx.translate(w/2, h/2); ctx.rotate((i/80)*Math.PI*2); if(finalH > 0.5) { ctx.beginPath(); ctx.roundRect(-1.5, innerRadius+20, 3, finalH+1.5, 1.5); ctx.fill(); } ctx.restore(); } } else { let avg = 0; for(let i=0; i<20; i++) avg += data[i]; avg = (avg/20)/255; particles.forEach((p, idx) => { if(!audio.paused) { p.life += p.speed + (avg*0.03); if(p.life>1) p.life=0; } const fIdx = Math.floor((idx/particles.length)*data.length*0.5); const r = innerRadius + (p.life*80) + (data[fIdx]/255)*50*p.life; ctx.fillStyle = `rgba(255, 183, 197, ${(1-p.life)*0.8})`; ctx.beginPath(); ctx.arc(w/2 + Math.cos(p.a)*r, h/2 + Math.sin(p.a)*r, 1.2, 0, Math.PI*2); ctx.fill(); }); } }
    function toggleLyricsMode() { document.getElementById('player-screen').classList.toggle('lyrics-active'); document.getElementById('lyrics-toggle').classList.toggle('active'); }
    function playSong(i) { initCtx(); currentIdx = i; audio.src = BASE_URL + songs[i].src; document.getElementById('m-jacket').src = document.getElementById('p-jacket').src = songs[i].img; document.getElementById('m-title').innerText = document.getElementById('p-title').innerText = songs[i].title; document.getElementById('m-artist').innerText = document.getElementById('p-artist').innerText = songs[i].artist; const lView = document.getElementById('lyrics-view'); lView.innerHTML = ''; if (songs[i].syncLyrics) { document.getElementById('lyrics-toggle').style.display = 'flex'; songs[i].syncLyrics.forEach((line, idx) => { const div = document.createElement('div'); div.className = 'lyric-line'; div.innerText = line.text; div.id = `lyric-${idx}`; lView.appendChild(div); }); } else { document.getElementById('lyrics-toggle').style.display = 'none'; } document.getElementById('mini-player').classList.add('visible'); audio.play(); updateUI(); }
    function toggleAudio() { initCtx(); audio.paused ? audio.play() : audio.pause(); updateUI(); }
    function updateUI() { const s = audio.paused ? 'is-paused' : 'is-playing'; document.getElementById('m-play-wrapper').className = 'btn-container ' + s; document.getElementById('p-play-wrapper').className = 'play-btn-main ' + s; document.getElementById('p-jacket').classList.toggle('paused', audio.paused); }
    audio.ontimeupdate = () => { if (!isSeeking) { const seek = document.getElementById('p-seek-range'); seek.max = audio.duration || 1; seek.value = audio.currentTime; const r = (audio.currentTime / seek.max) * 100 + '%'; document.getElementById('p-fill').style.width = r; document.getElementById('mini-progress').style.width = r; document.getElementById('time-current').innerText = fmt(audio.currentTime); document.getElementById('time-total').innerText = fmt(audio.duration || 0); const s = songs[currentIdx]; if (s.syncLyrics) { let cur = -1; s.syncLyrics.forEach((l, idx) => { if (audio.currentTime >= l.time) cur = idx; }); if (cur !== -1) { document.querySelectorAll('.lyric-line').forEach((l, idx) => l.classList.toggle('active', idx === cur)); const active = document.getElementById(`lyric-${cur}`); if (active) { const v = document.getElementById('lyrics-view'); v.scrollTop = active.offsetTop - v.offsetTop - 20; } } } } };
    const seek = document.getElementById('p-seek-range');
    seek.onmousedown = seek.ontouchstart = () => isSeeking = true;
    seek.oninput = (e) => { document.getElementById('p-fill').style.width = (e.target.value / audio.duration) * 100 + '%'; document.getElementById('time-current').innerText = fmt(e.target.value); };
    seek.onchange = (e) => { audio.currentTime = e.target.value; isSeeking = false; };
    audio.onended = () => playSong((currentIdx + 1) % songs.length);
    function fmt(s) { const m=Math.floor(s/60), v=Math.floor(s%60); return `${m}:${v<10?'0':''}${v}`; }
    function showFullPlayer() { document.getElementById('player-overlay').classList.add('active'); setTimeout(()=>document.getElementById('player-screen').style.transform='translateY(0)',10); }
    function closePlayer() { document.getElementById('player-screen').style.transform='translateY(100%)'; setTimeout(()=>{ document.getElementById('player-overlay').classList.remove('active'); document.getElementById('player-screen').classList.remove('lyrics-active'); },400); }
    function startPress() { pressTimer = setTimeout(() => { vizMode = (vizMode === 0 ? 1 : 0); }, 500); }
    function endPress() { clearTimeout(pressTimer); }
</script>
</body>
</html>
