<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Music App - Lyrics & Performance</title>
    <style>
        :root { --bg: #000; --text: #fff; --card: #1c1c1e; --accent: #ffb7c5; }
        html, body { margin: 0; padding: 0; height: 100%; width: 100%; overflow: hidden; position: fixed; background: var(--bg); color: var(--text); font-family: -apple-system, sans-serif; -webkit-tap-highlight-color: transparent; }
        
        #library-screen { padding: 20px; padding-top: 60px; height: 100vh; overflow-y: auto; box-sizing: border-box; padding-bottom: 120px; }
        .song-item { display: flex; align-items: center; padding: 12px 0; border-bottom: 0.5px solid rgba(255,255,255,0.1); cursor: pointer; }
        .song-item:active { background: rgba(255,255,255,0.05); }
        .song-item img { width: 55px; height: 55px; border-radius: 12px; margin-right: 15px; object-fit: cover; pointer-events: none; }

        /* ミニプレイヤーのアニメーション調整 */
        #mini-player { position: fixed; bottom: 15px; left: 10px; right: 10px; height: 64px; background: var(--card); border-radius: 12px; display: flex; align-items: center; padding: 0 15px; z-index: 200; transform: translateY(120px); transition: transform 0.4s cubic-bezier(0.2, 1, 0.2, 1); box-shadow: 0 -5px 15px rgba(0,0,0,0.3); }
        #mini-player.visible { transform: translateY(0); }
        #mini-player:active { transform: scale(0.97); transition: transform 0.1s; } /* タップ時の動き */
        #mini-progress { position: absolute; top: 0; left: 0; height: 2px; background: var(--accent); width: 0%; }

        #player-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.5); display: none; z-index: 300; }
        #player-overlay.active { display: block; }
        
        /* メインプレイヤーの展開速度を高速化 (0.4s) */
        #player-screen { position: fixed; bottom: 0; left: 0; width: 100%; height: 96%; background: var(--card); border-radius: 30px 30px 0 0; transform: translateY(100%); transition: transform 0.4s cubic-bezier(0.2, 1, 0.2, 1); overflow: hidden; }
        
        #bg-blur { position: absolute; inset: 0; z-index: -1; opacity: 0; transition: 0.8s ease-in-out; background: linear-gradient(180deg, #4b3a5a 0%, #2a1a3a 100%); }
        #player-screen.lyrics-active #bg-blur { opacity: 1; }

        .handle-area { width: 100%; height: 60px; display: flex; justify-content: center; align-items: center; touch-action: none; z-index: 501; position: absolute; top: 0; left: 0; }
        .handle { width: 36px; height: 5px; background: rgba(255,255,255,0.2); border-radius: 10px; }

        .main-visual { width: 100%; display: flex; flex-direction: column; align-items: center; transition: 0.5s cubic-bezier(0.4, 0, 0.2, 1); margin-top: 70px; }
        #p-img-large { width: 80vw; max-width: 300px; aspect-ratio: 1/1; border-radius: 15px; object-fit: cover; box-shadow: 0 20px 40px rgba(0,0,0,0.4); pointer-events: none; }

        #lyrics-view { 
            position: absolute; 
            top: 15%; 
            width: 100%; 
            height: 55%; 
            padding: 0 35px; 
            box-sizing: border-box; 
            overflow-y: auto; 
            opacity: 0; 
            transition: 0.6s cubic-bezier(0.4, 0, 0.2, 1); 
            scroll-behavior: smooth; 
            -webkit-mask-image: linear-gradient(to bottom, #000 0%, #000 80%, transparent 100%);
            mask-image: linear-gradient(to bottom, #000 0%, #000 80%, transparent 100%);
            pointer-events: none;
        }
        #lyrics-view::-webkit-scrollbar { display: none; }
        
        #player-screen.lyrics-active #lyrics-view { opacity: 1; transform: translateY(0); pointer-events: auto; }
        #player-screen:not(.lyrics-active) #lyrics-view { transform: translateY(20px); }
        #player-screen.lyrics-active .main-visual { opacity: 0; transform: scale(0.9) translateY(-20px); pointer-events: none; }

        .lyric-line { font-size: 26px; font-weight: 800; margin-bottom: 30px; color: rgba(255,255,255,0.15); transition: color 0.7s ease, transform 0.8s; line-height: 1.3; word-break: break-all; transform: scale(0.95); transform-origin: left center; }
        .lyric-line.active { color: #fff; transform: scale(1.08); filter: drop-shadow(0 0 10px rgba(255,255,255,0.3)); }

        .bottom-controls { position: absolute; bottom: 40px; width: 100%; display: flex; flex-direction: column; align-items: center; }
        .time-info { width: 85%; display: flex; justify-content: space-between; font-size: 12px; opacity: 0.5; margin-bottom: 5px; }
        .seek-bar { width: 85%; height: 4px; background: rgba(255,255,255,0.1); border-radius: 2px; position: relative; }
        #p-fill { height: 100%; background: #fff; width: 0%; border-radius: 2px; }
        #p-range { position: absolute; top: -15px; width: 100%; opacity: 0; height: 34px; cursor: pointer; }
        
        .play-btn { font-size: 60px; background: none; border: none; color: #fff; margin-top: 20px; outline: none; width: 80px; height: 80px; display: inline-flex; align-items: center; justify-content: center; }
        .sub-btn { position: absolute; bottom: 0px; background: none; border: none; opacity: 0.5; transition: 0.3s; padding: 10px; }
        .dl-btn { position: absolute; bottom: 0px; background: none; border: none; opacity: 0.5; transition: 0.3s; padding: 10px; right: 80px; }

        /* 吹き出しのスタイル */
        #dl-tooltip {
            position: absolute;
            bottom: 85px;
            right: 50px;
            background: var(--accent);
            color: #000;
            padding: 8px 12px;
            border-radius: 10px;
            font-size: 11px;
            font-weight: bold;
            z-index: 600;
            display: none;
            white-space: nowrap;
        }
        #dl-tooltip::after {
            content: "";
            position: absolute;
            top: 100%;
            right: 40px;
            border: 8px solid transparent;
            border-top-color: var(--accent);
        }
    </style>
</head>

        {title:'正しくなれない', artist:'ずっと真夜中でいいのに。', img:'https://i.kfs.io/album/global/96695506,1v1/fit/500x500.jpg', src:'song3.m4a'},
        {title:'フォニイ', artist:'ツミキ', img:'https://i1.sndcdn.com/artworks-tT9a73bRyGkxGhyM-gD3vjA-t500x500.jpg', src:'song4.m4a'},
        {title:'エゴロック', artist:'すりぃ', img:'https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRnUm5J7ccLutsqE-OElu_8yzJZXClKv98UWXiNVBHv7AtydVwZtMBLAdY&s=10', src:'song5.m4a'},
        {title:'恋風', artist:'幾田りら', img:'https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSR1CTX1feIVp0pqB5dsukeZg9TLh9SfxPZKrT779M9MlIjL4swLFbMt2o&s=10', src:'song6.m4a'},
        {title:'怪獣の花唄', artist:'Vaundy', img:'https://i.ytimg.com/vi/QPmwuAe2wBA/maxresdefault.jpg', src:'song7.m4a'},
        {title:'プロポーズ', artist:'なとり', img:'https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTSqJHqCO-a88-rl7YZiHVhkHSiKNipFC3Y69S6AjMi7pimx1e1-RpbTlkW&s=10', src:'song8.m4a'}
    ];

        const audio = new Audio();
    let currentIdx = -1, lastActiveIdx = -1, isSeeking = false, repeatMode = 0; 
    let db;
    let currentBlobUrl = null; // メモリ解放用

    // IndexedDB初期化
    const request = indexedDB.open("MusicAppDB", 1);
    request.onupgradeneeded = (e) => { e.target.result.createObjectStore("songs"); };
    request.onsuccess = (e) => { db = e.target.result; initLibrary(); loadLastState(); };

    function fmtTime(s) { if(isNaN(s)) return "0:00"; const m = Math.floor(s/60), sc = Math.floor(s%60); return `${m}:${sc < 10 ? '0'+sc : sc}`; }

    // --- 強化版: 保存機能 ---
    async function downloadCurrentSong() {
        if(currentIdx === -1) return;
        const song = songs[currentIdx];
        const url = BASE_URL + song.src;

        if(!confirm(`「${song.title}」をアプリ内に保存しますか？\n保存後はオフラインで再生可能です。`)) return;

        try {
            // 既に保存済みか確認
            const isStored = await new Promise(resolve => {
                const tx = db.transaction("songs", "readonly");
                const req = tx.objectStore("songs").get(url);
                req.onsuccess = () => resolve(!!req.result);
            });

            if (isStored) {
                alert("この曲は既に保存されています。");
                return;
            }

            const resp = await fetch(url);
            if (!resp.ok) throw new Error("データの取得に失敗しました");
            const blob = await resp.blob();

            const tx = db.transaction("songs", "readwrite");
            const store = tx.objectStore("songs");
            store.put(blob, url);

            tx.oncomplete = () => alert("アプリ内への保存が完了しました！");
            tx.onerror = () => { throw new Error("保存に失敗しました"); };
        } catch(e) {
            console.error(e);
            alert("保存に失敗しました。通信環境を確認してください。");
        }
    }

    // --- 強化版: キャッシュ取得 ---
    async function getAudioBlob(url) {
        if(!db) return url;
        return new Promise(resolve => {
            const tx = db.transaction("songs", "readonly");
            const store = tx.objectStore("songs");
            const req = store.get(url);
            req.onsuccess = () => {
                if (req.result instanceof Blob) {
                    resolve(URL.createObjectURL(req.result));
                } else {
                    resolve(url);
                }
            };
            req.onerror = () => resolve(url);
        });
    }

    function initLibrary() {
        document.getElementById('song-list').innerHTML = songs.map((s, i) => `
            <div class="song-item" onclick="playSong(${i})">
                <img src="${s.img}" loading="lazy">
                <div><div style="font-weight:600;">${s.title}</div><div style="font-size:12px;opacity:0.6;">${s.artist}</div></div>
            </div>`).join('');

        const playerScreen = document.getElementById('player-screen');
        let touchStartY = 0;
        playerScreen.addEventListener('touchstart', (e) => {
            const rect = playerScreen.getBoundingClientRect();
            if ((e.touches[0].clientY - rect.top) < rect.height / 5) touchStartY = e.touches[0].clientY;
            else touchStartY = 0;
        }, { passive: true });
        playerScreen.addEventListener('touchend', (e) => {
            if (touchStartY !== 0 && (e.changedTouches[0].clientY - touchStartY > 50)) closePlayer();
        }, { passive: true });
    }

    // --- 強化版: 再生処理 ---
    async function playSong(i, startAt = 0, autoPlay = true) {
        currentIdx = i; const song = songs[i];
        
        // メモリ解放
        if (currentBlobUrl) URL.revokeObjectURL(currentBlobUrl);

        const audioSource = await getAudioBlob(BASE_URL + song.src);
        if (audioSource.startsWith('blob:')) currentBlobUrl = audioSource;

        audio.src = audioSource;
        audio.currentTime = startAt;
        
        document.getElementById('m-img').src = document.getElementById('p-img-large').src = song.img;
        document.getElementById('m-title').innerText = document.getElementById('p-title-large').innerText = song.title;
        document.getElementById('p-artist-large').innerText = song.artist;
        document.getElementById('lyrics-view').innerHTML = (song.lyrics || []).map((l, idx) => `<div class="lyric-line" id="l-${idx}" onclick="audio.currentTime=${l.time}">${l.text}</div>`).join('');
        
        document.getElementById('mini-player').classList.add('visible');
        lastActiveIdx = -1;
        if (autoPlay) audio.play().catch(() => {});
        updateUI();

        if ('mediaSession' in navigator) {
            navigator.mediaSession.metadata = new MediaMetadata({
                title: song.title,
                artist: song.artist,
                artwork: [{ src: song.img, sizes: '512x512', type: 'image/jpeg' }]
            });
        }
    }


    function initLibrary() {
        document.getElementById('song-list').innerHTML = songs.map((s, i) => `
            <div class="song-item" onclick="playSong(${i})">
                <img src="${s.img}" loading="lazy">
                <div><div style="font-weight:600;">${s.title}</div><div style="font-size:12px;opacity:0.6;">${s.artist}</div></div>
            </div>`).join('');

        const playerScreen = document.getElementById('player-screen');
        let touchStartY = 0;
        playerScreen.addEventListener('touchstart', (e) => {
            const rect = playerScreen.getBoundingClientRect();
            if ((e.touches[0].clientY - rect.top) < rect.height / 5) touchStartY = e.touches[0].clientY;
            else touchStartY = 0;
        }, { passive: true });
        playerScreen.addEventListener('touchend', (e) => {
            if (touchStartY !== 0 && (e.changedTouches[0].clientY - touchStartY > 50)) closePlayer();
        }, { passive: true });
    }

    async function playSong(i, startAt = 0, autoPlay = true) {
        currentIdx = i; const song = songs[i];
        const blobUrl = await getAudioBlob(BASE_URL + song.src);
        audio.src = blobUrl;
        audio.currentTime = startAt;
        
        document.getElementById('m-img').src = document.getElementById('p-img-large').src = song.img;
        document.getElementById('m-title').innerText = document.getElementById('p-title-large').innerText = song.title;
        document.getElementById('p-artist-large').innerText = song.artist;
        document.getElementById('lyrics-view').innerHTML = (song.lyrics || []).map((l, idx) => `<div class="lyric-line" id="l-${idx}" onclick="audio.currentTime=${l.time}">${l.text}</div>`).join('');
        
        document.getElementById('mini-player').classList.add('visible');
        lastActiveIdx = -1;
        if (autoPlay) audio.play();
        updateUI();
            // ロック画面・通知センターに情報を表示する (Media Session API)
    if ('mediaSession' in navigator) {
        navigator.mediaSession.metadata = new MediaMetadata({
            title: song.title,
            artist: song.artist,
            album: 'Music App',
            artwork: [{ src: song.img, sizes: '512x512', type: 'image/jpeg' }]
        });

        // ロック画面のボタン操作の設定
        navigator.mediaSession.setActionHandler('play', () => { audio.play(); updateUI(); });
        navigator.mediaSession.setActionHandler('pause', () => { audio.pause(); updateUI(); });
        navigator.mediaSession.setActionHandler('previoustrack', () => { if(currentIdx > 0) playSong(currentIdx - 1); });
        navigator.mediaSession.setActionHandler('nexttrack', () => { if(currentIdx < songs.length - 1) playSong(currentIdx + 1); });
    }

    }

    function togglePlay() { audio.paused ? audio.play() : audio.pause(); updateUI(); }
    function updateUI() { 
        document.getElementById('m-play-btn').innerText = audio.paused ? '▶' : 'II'; 
        document.getElementById('p-play-btn').innerText = audio.paused ? '▶' : 'II'; 
    }

    function showFullPlayer() { 
        document.getElementById('player-overlay').classList.add('active'); 
        setTimeout(() => document.getElementById('player-screen').style.transform = 'translateY(0)', 10);
    }

    function closePlayer() { 
        document.getElementById('player-screen').style.transform = 'translateY(100%)'; 
        setTimeout(()=>document.getElementById('player-overlay').classList.remove('active'), 400); 
    }

    function toggleLyrics() { document.getElementById('player-screen').classList.toggle('lyrics-active'); }
    function toggleRepeat() { repeatMode = (repeatMode + 1) % 2; document.getElementById('repeat-btn').style.opacity = (repeatMode === 1) ? '1' : '0.5'; }

    function loadLastState() {
        const lastIdx = localStorage.getItem('lastSongIdx');
        const lastTime = localStorage.getItem('lastTime');
        if (lastIdx !== null) playSong(parseInt(lastIdx), parseFloat(lastTime || 0), false);
    }

    audio.ontimeupdate = () => {
        if (isSeeking) return;
        const p = (audio.currentTime / audio.duration) * 100 || 0;
        document.getElementById('p-fill').style.width = document.getElementById('mini-progress').style.width = p + '%';
        document.getElementById('p-range').value = audio.currentTime;
        document.getElementById('cur-time').innerText = fmtTime(audio.currentTime);
        localStorage.setItem('lastSongIdx', currentIdx);
        localStorage.setItem('lastTime', audio.currentTime);

        const song = songs[currentIdx];
        if (song && song.lyrics) {
            const idx = song.lyrics.findLastIndex(l => l.time <= audio.currentTime);
            if (idx !== lastActiveIdx && idx !== -1) {
                if (lastActiveIdx !== -1) document.getElementById(`l-${lastActiveIdx}`)?.classList.remove('active');
                const el = document.getElementById(`l-${idx}`);
                if (el) { el.classList.add('active'); el.scrollIntoView({ behavior: 'smooth', block: 'center' }); }
                lastActiveIdx = idx;
            }
        }
    };

    audio.onloadedmetadata = () => {
        document.getElementById('p-range').max = audio.duration;
        document.getElementById('dur-time').innerText = fmtTime(audio.duration);
    };

    document.getElementById('p-range').oninput = () => { isSeeking = true; };
    document.getElementById('p-range').onchange = (e) => { audio.currentTime = e.target.value; isSeeking = false; };
    audio.onended = () => { if(repeatMode === 1) { audio.currentTime = 0; audio.play(); } else if(currentIdx < songs.length-1) playSong(currentIdx+1); };

    // 吹き出しの初回表示判定
    window.addEventListener('load', () => {
        if (!document.cookie.split('; ').find(row => row.startsWith('tipSeen='))) {
            const tip = document.getElementById('dl-tooltip');
            if(tip) {
                tip.style.display = 'block';
                setTimeout(() => { tip.style.display = 'none'; }, 5000);
                document.cookie = "tipSeen=true; max-age=31536000; path=/";
            }
        }
    });
</script>
