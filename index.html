    :root { --bg: #000; --text: #fff; --card: #1c1c1e; --accent: #ffb7c5; }
    html, body { margin: 0; padding: 0; height: 100%; width: 100%; overflow: hidden; position: fixed; background: var(--bg); color: var(--text); font-family: -apple-system, sans-serif; -webkit-tap-highlight-color: transparent; }
    #mini-player { position: fixed; bottom: 15px; left: 10px; right: 10px; height: 64px; background: var(--card); border-radius: 12px; display: flex; align-items: center; padding: 0 15px; z-index: 200; transform: translateY(120px); transition: transform 0.4s cubic-bezier(0.2, 1, 0.2, 1); box-shadow: 0 -5px 15px rgba(0,0,0,0.3); }
    #mini-player.visible { transform: translateY(0); }
    #mini-player:active { transform: scale(0.97); }
    #mini-progress { position: absolute; top: 0; left: 0; height: 2px; background: var(--accent); width: 0%; }
    #player-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.5); display: none; z-index: 300; }
    #player-overlay.active { display: block; }
    #player-screen { position: fixed; bottom: 0; left: 0; width: 100%; height: 96%; background: var(--card); border-radius: 30px 30px 0 0; transform: translateY(100%); transition: transform 0.4s cubic-bezier(0.2, 1, 0.2, 1); overflow: hidden; }
    #bg-blur { position: absolute; inset: 0; z-index: -1; opacity: 0; transition: 0.8s; background: linear-gradient(180deg, #4b3a5a 0%, #2a1a3a 100%); }
    #player-screen.lyrics-active #bg-blur { opacity: 1; }
    
    .handle-area { width: 100%; height: 60px; display: flex; justify-content: center; align-items: center; touch-action: none; z-index: 501; position: absolute; top: 0; }

    #library-screen { padding: 20px; padding-top: 60px; height: 100vh; overflow-y: auto; box-sizing: border-box; padding-bottom: 200px; }
    .song-item { display: flex; align-items: center; padding: 12px 0; border-bottom: 0.5px solid rgba(255,255,255,0.1); }
    .song-item img { width: 55px; height: 55px; border-radius: 12px; margin-right: 15px; object-fit: cover; }
  #lyrics-view { 
    position: absolute; 
    top: 15%; 
    width: 100%; 
    height: 55%; 
    padding: 0 35px; 
    box-sizing: border-box; 
    overflow-y: auto; 
    
    /* 1. 歌詞を左寄せにする */
    text-align: left; 
    
    /* 2. 横バーを出さないための呪文 */
    overflow-x: hidden !important; 
    
    opacity: 0; 
    transition: 0.8s; 
    scroll-behavior: smooth; 
    pointer-events: none;
    z-index: 10;
}

/* 歌詞一行ずつの設定（左寄せを確実にする） */
.lyric-line {
    display: block;
    width: 100%;
    text-align: left !important;
    white-space: nowrap !important; /* デカくなっても改行させない */
}


/* 歌詞一行ずつの設定（横幅対策） */
/* 1. 器の設定 */
#lyrics-view { 
    position: absolute; 
    top: 15%; 
    width: 100%; 
    height: 55%; 
    padding: 0 30px; 
    box-sizing: border-box; 
    overflow-y: auto; 
    overflow-x: hidden !important; 
    opacity: 0; 
    transition: 0.8s; 
    scroll-behavior: smooth; 
    pointer-events: auto;
    z-index: 10;
    text-align: left; 
    font-size: 24px; 
}
/* 1. ジャケ写（通常画面）のアニメーション設定 */
.main-visual {
    width: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    margin-top: 70px;
    
    /* 戻る時の動きを滑らかにする */
    opacity: 1;
    transform: scale(1) translateY(0);
    transition: opacity 0.5s cubic-bezier(0.4, 0, 0.2, 1), 
                transform 0.5s cubic-bezier(0.4, 0, 0.2, 1);
    pointer-events: auto;
}

/* 歌詞モード中のジャケ写（小さくなって消える） */
#player-screen.lyrics-active .main-visual {
    opacity: 0 !important;
    transform: scale(0.8) translateY(-40px) !important;
    pointer-events: none !important;
}

/* 2. 歌詞エリアのアニメーション設定 */
#lyrics-view {
    position: absolute;
    top: 15%;
    width: 100%;
    height: 55%;
    padding: 0 35px;
    box-sizing: border-box;
    overflow-y: auto;
    overflow-x: hidden !important;
    
    /* 消えている時の状態 */
    opacity: 0;
    transform: translateY(30px); /* 少し下から出てくる */
    visibility: hidden;
    transition: opacity 0.5s ease, 
                transform 0.5s cubic-bezier(0.4, 0, 0.2, 1),
                visibility 0.5s;
    
    pointer-events: none;
    z-index: 10;
}

/* 歌詞モード中の歌詞エリア（ふわっと浮き上がる） */
#player-screen.lyrics-active #lyrics-view {
    opacity: 1 !important;
    transform: translateY(0) !important;
    visibility: visible !important;
    pointer-events: auto !important;
}

/* 2. 歌詞一行ずつの設定（改行許可・左寄せ） */
.lyric-line { 
    display: block;
    width: 100%;
    white-space: normal !important; 
    word-wrap: break-word; 
    font-size: 28px; 
    font-weight: 800; 
    margin-bottom: 35px; 
    color: rgba(255,255,255,0.2); 
    filter: blur(4px); 
    transition: 0.8s; 
    line-height: 1.4; 
    transform: scale(0.95); 
    transform-origin: left center; 
    position: relative; 
    text-align: left !important;
    text-shadow: 0 2px 10px rgba(0, 0, 0, 0.5); /* 影も忘れずに */
}

/* 3. アクティブ・過去の状態 */
.lyric-line.active { color: #fff !important; transform: scale(1.1) !important; filter: blur(0px) !important; opacity: 1 !important; }
.lyric-line.past { color: rgba(255,255,255,0.1); filter: blur(5px); transform: translateY(-15px) scale(0.95); }

/* 4. ○ ○ ○ 特殊演出（左寄せVer.） */
.lyric-line.is-blank-line {
    position: relative;
    font-size: 18px !important; 
    height: 40px;
    display: flex;
    justify-content: flex-start; /* 左寄せ */
    align-items: center;
    margin: 40px 0;
    opacity: 0;
    transform: scale(1);
    transition: opacity 0.3s ease, transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
}

.lyric-line.is-blank-line.active { opacity: 1 !important; }
.lyric-line.is-blank-line.active.pre-exit { transform: scale(1.35) !important; }
.lyric-line.is-blank-line.is-gone { opacity: 0 !important; transform: scale(0.3) !important; }

.is-blank-line::before {
    content: '○ ○ ○';
    letter-spacing: 8px;
    color: rgba(255, 255, 255, 0.2);
    position: absolute;
    left: 0; /* 左端に固定 */
}
.is-blank-line::after {
    content: '● ● ●';
    letter-spacing: 8px;
    color: #fff;
    position: absolute;
    left: 0; /* 左端に固定 */
    clip-path: inset(0 calc(100% - var(--perc, 0) * 1%) 0 0);
}

@keyframes apple-floating {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.05); }
}

#lyrics-view.no-blur .lyric-line:not(.active) { filter: blur(0px) !important; color: rgba(255,255,255,0.6); transition: 0.5s; }
    
    .bottom-controls { position: absolute; bottom: 40px; width: 100%; display: flex; flex-direction: column; align-items: center; }

        const guide = document.getElementById('repeat-guide');
        if (!document.cookie.split('; ').find(row => row.startsWith('repeat_guide_seen='))) {
            guide.style.display = 'block';
            const hideGuide = () => {
                guide.style.opacity = '0';
                setTimeout(() => { guide.style.display = 'none'; }, 500);
                document.cookie = "repeat_guide_seen=true; max-age=31536000; path=/";
                window.removeEventListener('touchstart', hideGuide);

            window.addEventListener('touchstart', hideGuide);
            setTimeout(hideGuide, 6000); 
        }
    }

    // --- 時間同期の統合処理 ---
// --- 1. 時間同期と「● ● ●」演出の修正 ---
function updateUI(time) {
    if (isSeeking) return;
    const song = songs[currentIdx];
    if (!song) return;

    const duration = (song.title === '夢で描けば' ? 273 : audio.duration) || 0;
    const progress = (time / duration) * 100;
    
    if (document.getElementById('p-fill')) document.getElementById('p-fill').style.width = progress + '%';
    if (document.getElementById('mini-progress')) document.getElementById('mini-progress').style.width = progress + '%';
    if (document.getElementById('p-range')) { 
        document.getElementById('p-range').max = duration; 
        document.getElementById('p-range').value = time; 
    }
    if (document.getElementById('cur-time')) document.getElementById('cur-time').innerText = fmtTime(time);

    // 最後に再生した情報を保存（Cookieより確実なLocalStorageを使用）
    localStorage.setItem('lastSongIdx', currentIdx);
    localStorage.setItem('lastTime', time);

// --- 歌詞の連動とスクロール制御の修正 ---
if (song.lyrics) {
    const idx = song.lyrics.findLastIndex(l => l.time <= time + 0.05);
    
    if (idx !== -1) {
        const container = document.getElementById('lyrics-view');
        const lines = document.querySelectorAll('.lyric-line');
        const activeEl = document.getElementById(`l-${idx}`);
        
// updateUI 内の歌詞切り替え部分
if (idx !== lastActiveIdx) {
    lines.forEach((el, i) => { 
        // ○○○ 以外の時は普通にクラスを掃除する
        if (!el.classList.contains('is-blank-line')) {
            el.classList.remove('active', 'past');
        }
        
        if (i < idx) {
            el.classList.add('past');
            el.classList.remove('active');
            // ○○○ が過去（past）になった瞬間、縮小クラスを強制的に付ける
            if (el.classList.contains('is-blank-line')) {
                el.classList.add('is-gone');
            }
        } else if (i === idx) {
            el.classList.add('active');
            el.classList.remove('past', 'is-gone', 'pre-exit');
        }
    });

    // スクロール処理（○○○の時もその位置を計算）
    if (activeEl && !isUserTouching && container) {
        const target = activeEl.offsetTop - (container.offsetHeight * 0.3);
        container.scrollTo({ top: target, behavior: 'smooth' });
    }
    lastActiveIdx = idx;
}

// ○○○ 実行中のカウントダウン処理
const text = (song.lyrics[idx].text || "").trim();
if (text === "" && activeEl) {
    const startTime = song.lyrics[idx].time;
    const next = song.lyrics[idx + 1];
    
    if (next) {
        const timeLeft = next.time - time;
        const totalGap = next.time - startTime;
        
        // 染まりきるのは 0.2秒前
        let ratio = Math.min(Math.max((time - startTime) / (totalGap - 0.2), 0), 1);
        activeEl.style.setProperty('--perc', ratio * 100);

        if (timeLeft <= 0.5 && timeLeft > 0.2) {
            activeEl.classList.add('pre-exit');
        } else if (timeLeft <= 0.2) {
            // ここで縮小開始
            activeEl.classList.add('is-gone');
            activeEl.classList.remove('pre-exit');
        }
    }
}


}
    }
}

// --- 2. ページ読み込み時の復元処理の修正 ---
window.addEventListener('load', () => {
    // 1. まずライブラリを生成（songs配列が必要なため）
    initLibrary();

    // 2. その後で前回の状態を復元
    const lastIdx = localStorage.getItem('lastSongIdx');
    const lastTime = localStorage.getItem('lastTime');
    
    if (lastIdx !== null && songs[lastIdx]) {
        // autoPlayをfalseにして、ミニプレイヤーだけ表示させる
        playSong(parseInt(lastIdx), parseFloat(lastTime || 0), false);
        
        // UIを初期化状態に更新
        setTimeout(() => {
            updateUI(parseFloat(lastTime || 0));
        }, 100);
    }
});

    const isMV = document.getElementById('video-container').style.display === 'block';
    
    if (isMV) video.currentTime = val;
    else audio.currentTime = val;
    
    isSeeking = false;

};

    // 再生状態の同期
    const updatePlayBtn = () => {
        const video = document.getElementById('main-video');

    audio.onended = () => { if (repeatMode === 2) { audio.currentTime = 0; audio.play(); } else { nextSong(); } };

        navigator.mediaSession.setActionHandler('play', () => {
            if (document.getElementById('video-container').style.display === 'block') document.getElementById('main-video').play();

        });

        navigator.mediaSession.setActionHandler('nexttrack', () => nextSong());
    }

    initLibrary();
    window.addEventListener('load', () => {
        const lastIdx = localStorage.getItem('lastSongIdx');
        const lastTime = localStorage.getItem('lastTime');
        if (lastIdx !== null) { playSong(parseInt(lastIdx), parseFloat(lastTime || 0), false); }
    });

    let startY = 0, currentY = 0;
    const playerScreen = document.getElementById('player-screen');
    document.querySelector('.handle-area').addEventListener('touchstart', (e) => { startY = e.touches[0].clientY; playerScreen.style.transition = 'none'; }, { passive: true });
    document.querySelector('.handle-area').addEventListener('touchmove', (e) => { currentY = e.touches[0].clientY - startY; if (currentY > 0) playerScreen.style.transform = `translateY(${currentY}px)`; }, { passive: true });
    document.querySelector('.handle-area').addEventListener('touchend', () => { playerScreen.style.transition = 'transform 0.4s cubic-bezier(0.2, 1, 0.2, 1)'; if (currentY > 100) closePlayer(); else playerScreen.style.transform = 'translateY(0)'; currentY = 0; });
// <script> の最後の方、audio.onplay などの近くにこれを追加
audio.ontimeupdate = () => {
    if (document.getElementById('video-container').style.display !== 'block') {
        updateUI(audio.currentTime);
    }
};

</script>
